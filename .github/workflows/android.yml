name: Android proof
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # v4 installs the command-line tools, accepts the licenses and puts sdkmanager on the PATH. v3 failed on
      # current runners: its default packages included 'tools', which the SDK repository no longer provides.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, build and lint
        run: bash gradlew :core:test :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: pub-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
